<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>WorkoutLog Pro · Live demo</title>
<meta name="description" content="Interactive demo of WorkoutLog Pro, a gym log built for entry between sets, with sample workout history.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="apple-mobile-web-app-title" content="WorkoutLog">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one app column (max 620px) with a thumb-reachable bottom nav. Home = next workout
   hero + week strip + collapsible days. Workout = full-height sheet with steppers, sticky progress
   and an auto rest timer. Muscle maps are inline SVG figures, muscles in plate red. */
:root {
  --bg: #eceef0;
  --surface: #ffffff;
  --surface-2: #e2e5e9;
  --ink: #14171b;
  --muted: #5d6570;
  --line: #d3d8de;
  --accent: #d4213a;        /* 25 kg competition plate */
  --accent-ink: #ffffff;
  --accent-2: #1f5fbf;      /* 20 kg plate */
  --body: #d9dde2;
  --muscle: #c3c9d0;
  --good: #198754;
  --warn: #c25a0c;
  --scrim: rgba(14, 17, 21, 0.45);
  --shadow: 0 1px 2px rgba(20, 23, 27, 0.06), 0 8px 24px rgba(20, 23, 27, 0.08);

  --font-display: "Archivo", "Arial Narrow", "Helvetica Neue", system-ui, sans-serif;
  --font-body: "Figtree", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --font-label: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r-card: 16px;
  --r-ctl: 11px;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1114; --surface: #181b20; --surface-2: #23272e; --ink: #edf0f3; --muted: #9aa3ad; --line: #2c3139;
    --accent: #ff4d63; --accent-ink: #1b0408; --accent-2: #5d9bff; --body: #2a2f37; --muscle: #3b414b;
    --good: #43c486; --warn: #ff9a4d; --scrim: rgba(0,0,0,.6); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1114; --surface: #181b20; --surface-2: #23272e; --ink: #edf0f3; --muted: #9aa3ad; --line: #2c3139;
  --accent: #ff4d63; --accent-ink: #1b0408; --accent-2: #5d9bff; --body: #2a2f37; --muscle: #3b414b;
  --good: #43c486; --warn: #ff9a4d; --scrim: rgba(0,0,0,.6); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px));
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2.5px solid var(--accent-2); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.label { font: 500 11px/1.25 var(--font-label); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1, h2, h3, h4 { margin: 0; font-family: var(--font-display); text-wrap: balance; }
.disp { font-family: var(--font-display); font-stretch: 75%; font-weight: 800; text-transform: uppercase; letter-spacing: .01em; }
.app { max-width: 620px; margin: 0 auto; display: grid; gap: 16px; }
.stack { display: grid; gap: 14px; }
.row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.hint { font-size: 13px; color: var(--muted); }

.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { font-size: 26px; font-stretch: 80%; font-weight: 900; letter-spacing: -.01em; }
.brand h1 span { color: var(--accent); }

/* Bottom nav */
.nav { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line);
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.nav-in { max-width: 620px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.nav button { border: 0; background: transparent; border-radius: 12px; height: 52px; display: grid; justify-items: center; align-content: center; gap: 2px;
  font-size: 12px; font-weight: 600; color: var(--muted); }
.nav button svg { width: 24px; height: 24px; }
.nav button[aria-selected="true"] { color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, transparent); }

.card { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow); padding: 16px; }
.demo-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}.demo-bar strong{color:var(--ink)}.demo-bar .sp{flex:1}.demo-bar a,.demo-bar button{font:inherit;font-weight:600;color:var(--accent);background:none;border:0;padding:2px 0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.banner { font-size: 13.5px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r-ctl); padding: 10px 12px; }
.notice { border-radius: 12px; padding: 11px 13px; font-size: 14px; background: color-mix(in srgb, var(--accent-2) 12%, var(--surface)); }
.notice.error { background: color-mix(in srgb, var(--warn) 16%, var(--surface)); }
.notice.tip { background: color-mix(in srgb, var(--good) 14%, var(--surface)); }

.btn { border: 0; border-radius: var(--r-ctl); padding: 11px 15px; font-weight: 600; background: var(--surface-2); color: var(--ink);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.blue { background: var(--accent-2); color: #fff; }
.btn.ghost { background: transparent; color: var(--muted); }
.btn.small { padding: 7px 11px; font-size: 13.5px; }
.btn.big { padding: 16px 18px; font-size: 17px; border-radius: 14px; }
.btn.block { width: 100%; }
.btn.danger { background: transparent; color: var(--warn); }
.btn.danger.armed { background: var(--warn); color: var(--surface); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:active:not(:disabled) { transform: scale(.98); }
.field { display: grid; gap: 6px; }
.input, .field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-ctl); padding: 10px 12px; }
.field textarea { resize: vertical; min-height: 60px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tag { display: inline-block; font: 500 11px/1 var(--font-label); letter-spacing: .06em; text-transform: uppercase; padding: 5px 8px; border-radius: 99px; background: var(--surface-2); }
.tag.sample { background: color-mix(in srgb, var(--warn) 18%, var(--surface)); color: var(--warn); }

/* Home hero */
.next-card { display: grid; gap: 14px; position: relative; overflow: hidden; }
.next-card::after { content: ""; position: absolute; right: -46px; top: -46px; width: 150px; height: 150px; border-radius: 50%;
  border: 18px solid color-mix(in srgb, var(--accent) 12%, transparent); pointer-events: none; }
.next-card h2 { font-size: 34px; line-height: .98; font-stretch: 70%; font-weight: 900; text-transform: uppercase; }
.next-meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.next-meta b { color: var(--ink); font-variant-numeric: tabular-nums; }
.ex-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.ex-chips span { font-size: 13px; padding: 4px 9px; border-radius: 99px; background: var(--surface-2); }

.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; text-align: center; }
.week .d { display: grid; justify-items: center; gap: 5px; font: 500 11px var(--font-label); color: var(--muted); text-transform: uppercase; }
.week .dot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font: 800 12px var(--font-display); color: var(--accent-ink); }
.week .dot.on { background: var(--accent); border-color: var(--accent); }
.week .today .dot { border-color: var(--ink); }

/* Plates & day cards */
.plate { width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none;
  font: 900 19px/1 var(--font-display); box-shadow: inset 0 0 0 5px color-mix(in srgb, #000 14%, var(--accent)), inset 0 0 0 9px var(--accent); }
.plate.b { background: var(--accent-2); color: #fff; box-shadow: inset 0 0 0 5px color-mix(in srgb, #000 16%, var(--accent-2)), inset 0 0 0 9px var(--accent-2); }
.plate.c { background: var(--ink); color: var(--surface); box-shadow: inset 0 0 0 5px color-mix(in srgb, var(--surface) 18%, var(--ink)), inset 0 0 0 9px var(--ink); }
details.day { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow); overflow: hidden; }
details.day summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 13px 16px; }
details.day summary::-webkit-details-marker { display: none; }
details.day summary h3 { font-size: 17px; font-weight: 800; font-stretch: 85%; }
details.day summary .chev { transition: transform .2s ease; color: var(--muted); }
details.day[open] summary .chev { transform: rotate(180deg); }
details.day[open] summary { border-bottom: 1px solid var(--line); }
.next-pill { font: 500 10.5px/1 var(--font-label); letter-spacing: .08em; text-transform: uppercase; background: var(--accent); color: var(--accent-ink); padding: 4px 6px; border-radius: 6px; margin-left: 6px; vertical-align: 2px; }
.ex-row { display: grid; grid-template-columns: 60px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%;
  text-align: left; border: 0; border-bottom: 1px solid var(--line); background: var(--surface); padding: 10px 16px; }
.ex-row:hover { background: color-mix(in srgb, var(--surface-2) 40%, var(--surface)); }
.ex-row .name { font-weight: 700; }
.ex-row .meta { font-size: 13px; color: var(--muted); }
.ex-row .dose { font: 800 17px/1 var(--font-display); font-stretch: 80%; white-space: nowrap; text-align: right; }
.ex-row .dose small { display: block; font: 500 11px var(--font-label); color: var(--muted); margin-top: 4px; letter-spacing: .04em; }
.day-foot { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

/* Muscle map */
.map { display: flex; gap: 2px; align-items: flex-end; }
.map svg { display: block; height: auto; }
.map .fig { display: grid; justify-items: center; gap: 2px; }
.map .bodyfill { fill: var(--body); }
.map .m { fill: var(--muscle); stroke: var(--surface); stroke-width: .6; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; padding: 5px 11px; border-radius: 99px; background: var(--surface-2); border: 0; }
.chip.p { background: var(--accent); color: var(--accent-ink); }
.chip.s { background: color-mix(in srgb, var(--accent) 22%, var(--surface)); }
button.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

/* Library */
.search { position: relative; }
.search input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 11px 14px 11px 40px; }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; }
.lib-card { border: 0; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 12px; text-align: left; display: grid; gap: 8px; justify-items: start; }
.lib-card .name { font-weight: 700; line-height: 1.25; }
.lib-card .meta { font-size: 12.5px; color: var(--muted); }

/* Progress */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 12px; }
.stat .v { font: 900 26px/1.1 var(--font-display); font-stretch: 75%; }
.balance { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; }
@media (max-width: 480px) { .balance { grid-template-columns: minmax(0, 1fr); justify-items: center; } .bal-list { width: 100%; } }
.bal-list { display: grid; gap: 9px; }
.bal-row { display: grid; grid-template-columns: 82px minmax(0, 1fr) 54px; gap: 10px; align-items: center; font-size: 13.5px; }
.bal-row .bar { height: 8px; border-radius: 99px; background: var(--surface-2); position: relative; overflow: hidden; }
.bal-row .bar i { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--accent); }
.bal-row .bar b { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: var(--ink); opacity: .35; }
.bal-row .v { text-align: right; font-weight: 700; }
.pr-list { display: grid; gap: 0; }
.pr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.pr:last-child { border-bottom: 0; }
.pr .w { font: 800 18px var(--font-display); font-stretch: 80%; }
.chart-wrap { overflow-x: auto; }
.chart { width: 100%; min-width: 290px; height: auto; display: block; }
.chart text { fill: var(--muted); font: 500 11px var(--font-label); }
details.sess { border-bottom: 1px solid var(--line); }
details.sess:last-child { border-bottom: 0; }
details.sess summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 12px 16px; }
details.sess summary::-webkit-details-marker { display: none; }
details.sess .t { font-weight: 700; }
details.sess .m { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.sess-body { padding: 0 16px 12px; display: grid; gap: 6px; font-size: 14px; }
.sess-body .r { display: flex; justify-content: space-between; gap: 10px; }
.empty { text-align: center; padding: 26px 18px; color: var(--muted); display: grid; gap: 6px; justify-items: center; }
.empty strong { color: var(--ink); font: 800 19px var(--font-display); font-stretch: 85%; }

/* Sheet */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; animation: fade .2s ease; }
.sheet { position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 640px;
  max-height: calc(100% - 16px - env(safe-area-inset-top, 0px)); background: var(--bg); border-radius: 20px 20px 0 0;
  display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0,0,0,.22); animation: rise .26s cubic-bezier(.2,.8,.2,1); }
.sheet.tall { height: calc(100% - 16px - env(safe-area-inset-top, 0px)); }
.sheet-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.sheet-head h2 { font-size: 16px; font-weight: 800; font-stretch: 85%; text-align: center; }
.sheet-head .right { justify-self: end; }
.sheet-body { overflow-y: auto; display: grid; gap: 14px; align-content: start; flex: 1; scroll-behavior: smooth;
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) 18px max(16px, env(safe-area-inset-left, 0px)); }
.sheet-foot { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; border-top: 1px solid var(--line); background: var(--surface);
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet-foot.one { grid-template-columns: 1fr; }
@keyframes rise { from { transform: translateY(28px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
.busy { display: grid; justify-items: center; gap: 12px; padding: 34px 10px; text-align: center; }
.spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--surface-2); border-top-color: var(--accent); animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Workout */
.w-top { display: grid; gap: 8px; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.w-top .stats-line { display: flex; justify-content: space-between; font-size: 13.5px; color: var(--muted); }
.w-top .stats-line b { color: var(--ink); }
.pbar { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--good); border-radius: inherit; transition: width .35s ease; }
.w-ex { display: grid; gap: 10px; border: 2px solid transparent; transition: border-color .2s ease; }
.w-ex.current { border-color: var(--accent); }
.w-ex.complete { opacity: .82; }
.w-head { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.w-head .name { font-weight: 800; font-size: 17px; font-family: var(--font-display); font-stretch: 88%; line-height: 1.15; }
.w-head .done-badge { font: 800 13px var(--font-display); color: var(--good); white-space: nowrap; }
.w-collapse { border: 0; background: none; padding: 0; text-align: left; width: 100%; }
.prev { font-size: 13px; color: var(--muted); }
.sets { display: grid; gap: 7px; }
.set-labels { display: grid; grid-template-columns: 22px minmax(0, 1fr) minmax(0, 1fr) 46px; gap: 8px; }
.set-labels span { font: 500 10.5px var(--font-label); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: center; }
.set { display: grid; grid-template-columns: 22px minmax(0, 1fr) minmax(0, 1fr) 46px; gap: 8px; align-items: center; }
.set .n { font: 800 15px var(--font-display); color: var(--muted); text-align: center; }
.stepper { display: grid; grid-template-columns: 34px minmax(0, 1fr) 34px; align-items: center; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); overflow: hidden; }
.stepper button { border: 0; background: var(--surface-2); height: 42px; font-size: 19px; font-weight: 700; color: var(--ink); }
.stepper input { border: 0; background: transparent; width: 100%; min-width: 0; text-align: center; font-weight: 700; font-size: 16px; padding: 0; font-variant-numeric: tabular-nums; height: 42px; }
.tick { width: 46px; height: 44px; border-radius: 11px; border: 1.5px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 19px; color: var(--muted); }
.tick[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: #fff; }
.set.done .stepper { background: color-mix(in srgb, var(--good) 9%, var(--surface)); border-color: color-mix(in srgb, var(--good) 40%, var(--line)); }
.set.done .stepper button { background: transparent; color: var(--muted); }
.vid { color: var(--accent-2); font-weight: 600; font-size: 13px; text-decoration: none; }
.rest { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--ink); color: var(--surface);
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.rest .clock { font: 900 30px/1 var(--font-display); font-stretch: 75%; font-variant-numeric: tabular-nums; }
.rest .rb { height: 4px; border-radius: 99px; background: color-mix(in srgb, var(--surface) 25%, transparent); margin-top: 7px; overflow: hidden; }
.rest .rb i { display: block; height: 100%; background: var(--accent); }
.rest .btns { display: flex; gap: 6px; }
.rest .btns button { border: 0; border-radius: 10px; background: color-mix(in srgb, var(--surface) 16%, transparent); color: var(--surface); padding: 9px 11px; font-weight: 700; font-size: 13.5px; }
.rest.ready { background: var(--good); }
.summary-big { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; text-align: center; }
.summary-big .v { font: 900 30px/1 var(--font-display); font-stretch: 72%; }
.photo { border-radius: 14px; overflow: hidden; background: var(--surface-2); }
.photo img { display: block; width: 100%; max-height: 320px; object-fit: cover; }
.upload { position: relative; overflow: hidden; }
.upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.switch { display: inline-flex; gap: 8px; align-items: center; font-size: 13.5px; cursor: pointer; }
.switch input { width: 18px; height: 18px; accent-color: var(--accent); }

/* Toast */

    showSheet("Swap " + e.name, body, null, { cancelText: "‹ Workout", onCancel: back });
  }

  const doneCount = () => W.entries.reduce((a, en) => a + en.sets.filter((x) => x.done).length, 0);
  const totalCount = () => W.entries.reduce((a, en) => a + en.sets.length, 0);
  const currentIndex = () => W.entries.findIndex((en) => en.sets.some((x) => !x.done));

  function beep() {
    if (!S.sound) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.22].forEach((t) => { const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
        g.gain.setValueAtTime(0.0001, audioCtx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.3, audioCtx.currentTime + t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + t + 0.16); o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.18); });
    } catch {}
  }
  async function keepAwake() {
    try { if ("wakeLock" in navigator && !wakeLock && document.visibilityState === "visible") { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch {}
  }
  document.addEventListener("visibilitychange", () => { if (sheetKind === "workout") keepAwake(); });
  function leaveWorkoutView() {
    clearInterval(tickTimer); tickTimer = null;
    try { wakeLock && wakeLock.release(); } catch {} wakeLock = null;
  }

  let wEls = null;
  function openWorkout(restoreTop) {
    if (!W) return;
    const top = h("div", { class: "w-top" },
      h("div", { class: "stats-line" }, h("span", {}, "Time ", h("b", { class: "num", "data-el": "elapsed" }, "0:00")), h("span", {}, h("b", { class: "num", "data-el": "count" }, ""), " sets")),
      h("div", { class: "pbar", "aria-hidden": "true" }, h("i", { "data-el": "pbar" })));
    const restBar = h("div", { class: "rest", "data-el": "rest", hidden: true },
      h("div", {}, h("div", { class: "label", style: "color:inherit;opacity:.8", "data-el": "restLabel" }, "Rest"), h("div", { class: "clock", "data-el": "clock" }, "0:00"),
        h("div", { class: "rb" }, h("i", { "data-el": "restFill" }))),
      h("div", { class: "btns" },
        h("button", { type: "button", onclick: () => { if (R) { R.endAt -= 15000; R.rang = false; } }, "aria-label": "15 seconds less" }, "−15"),
        h("button", { type: "button", onclick: () => { if (R) { R.endAt += 15000; R.total += 15000; R.rang = false; } }, "aria-label": "15 seconds more" }, "+15"),
        h("button", { type: "button", onclick: () => { R = null; updateWorkoutChrome(); } }, "Skip")));
    const foot = h("div", {}, restBar, h("div", { class: "sheet-foot" },
      h("label", { class: "switch" }, h("input", { id: "w-sound", type: "checkbox", checked: S.sound, onchange: (e) => { S.sound = e.target.checked; lsSet("sound", S.sound); } }), "Sound alert"),
      h("button", { class: "btn primary", type: "button", onclick: finishWorkout }, "Finish workout")));
    const sheet = showSheet(W.dayTitle, [], foot, { tall: true, kind: "workout", cancelText: "Minimize",
      right: h("button", { class: "btn ghost", type: "button", style: "padding:8px 6px;color:var(--warn)", onclick: confirmDiscard }, "Discard"), top });
    wEls = Object.fromEntries([...sheet.querySelectorAll("[data-el]")].map((el) => [el.dataset.el, el]));
    wEls.body = sheet.querySelector(".sheet-body");
    renderWorkoutBody(typeof restoreTop !== "number");
    if (typeof restoreTop === "number") wEls.body.scrollTop = restoreTop;
    keepAwake();
    clearInterval(tickTimer);
    tickTimer = setInterval(updateWorkoutChrome, 250);
    updateWorkoutChrome();
  }

  function confirmDiscard() {
    const body = [h("div", { class: "empty" }, h("strong", {}, "Discard this workout?"), `${doneCount()} completed sets will be deleted without saving.`)];
    showSheet("Discard", body, h("div", { class: "sheet-foot" },
      h("button", { class: "btn", type: "button", onclick: () => openWorkout() }, "Keep going"),
      h("button", { class: "btn primary", type: "button", onclick: () => {
        const id = W.sessId, wasSaved = autosaved;
        clearTimeout(autosaveTimer); autosaveTimer = null; autosaved = false;
        W = null; R = null; saveW(); closeSheet(); toast("Workout discarded");
        if (wasSaved) Store.deleteSession(id).catch(() => {});
      } }, "Discard")));
  }

  function updateWorkoutChrome() {
    if (!W || !wEls || !wEls.elapsed.isConnected) return;
    wEls.elapsed.textContent = mmss((Date.now() - W.startedAt) / 1000);
    const d = doneCount(), t = totalCount();
    wEls.count.textContent = `${d}/${t}`;
    wEls.pbar.style.width = (t ? (d / t) * 100 : 0) + "%";
    if (R) {
      const left = (R.endAt - Date.now()) / 1000;
      wEls.rest.hidden = false;
      if (left <= 0) {
        wEls.rest.classList.add("ready"); wEls.clock.textContent = "Go!"; wEls.restLabel.textContent = "Time for your next set"; wEls.restFill.style.width = "100%";
        if (!R.rang) { R.rang = true; beep(); }
        if (left < -20) { R = null; wEls.rest.hidden = true; }
      } else {
        wEls.rest.classList.remove("ready"); wEls.restLabel.textContent = "Rest"; wEls.clock.textContent = mmss(left);
        wEls.restFill.style.width = (100 * (1 - left / (R.total / 1000))) + "%";
      }
    } else wEls.rest.hidden = true;
  }

  function stepper(value, step, digits, label, onChange) {
    const input = h("input", { inputMode: digits ? "decimal" : "numeric", value: value === "" ? "" : digits ? fmtKg(value) : String(value), placeholder: "–", "aria-label": label,
      oninput: (ev) => onChange(ev.target.value === "" ? "" : parseNum(ev.target.value) ?? "") , onfocus: (ev) => ev.target.select() });
    const bump = (dir) => { const cur = parseNum(input.value) || 0; const nv = Math.max(0, Math.round((cur + dir * step) * 10) / 10);
      input.value = digits ? fmtKg(nv) : String(nv); onChange(nv); };
    return h("div", { class: "stepper" },
      h("button", { type: "button", "aria-label": "Decrease " + label, onclick: () => bump(-1) }, "−"), input,
      h("button", { type: "button", "aria-label": "Increase " + label, onclick: () => bump(1) }, "+"));
  }

  function renderWorkoutBody(scrollToCurrent) {
    if (!wEls) return;
    const keep = wEls.body.scrollTop;
    const cur = currentIndex();
    const cards = W.entries.map((en, i) => {
      const e = EXBY[en.ex];
      const complete = en.sets.every((x) => x.done);
      const open = W.open[i] ?? !complete;
      const last = lastEntry(en.ex);
      const head = h("div", { class: "w-head" }, muscleMap(exWeights(e), 25, false, exAria(e)),
        h("div", { style: "min-width:0" }, h("div", { class: "name" }, e.name),
          h("div", { class: "hint num" }, `${en.planned.sets} × ${en.planned.reps} ${unitLabel(e.unit)}` + (en.planned.rest ? ` · ${en.planned.rest} sec rest` : ""))),
        complete ? h("span", { class: "done-badge" }, "✓ Done") : h("span", { class: "hint num" }, `${en.sets.filter((x) => x.done).length}/${en.sets.length}`));
      if (!open) return h("section", { class: "card w-ex complete", id: "wex-" + i },
        h("button", { class: "w-collapse", type: "button", "aria-expanded": "false", onclick: () => { W.open[i] = true; saveW(); renderWorkoutBody(); } }, head));
      return h("section", { class: "card w-ex" + (i === cur ? " current" : ""), id: "wex-" + i },
        complete ? h("button", { class: "w-collapse", type: "button", "aria-expanded": "true", onclick: () => { W.open[i] = false; saveW(); renderWorkoutBody(); } }, head) : head,
        en.tip ? h("div", { class: "notice tip" }, "↑ ", en.tip) : null,
        h("div", { class: "row", style: "gap:6px 14px;justify-content:flex-start" },
          last ? h("span", { class: "prev num" }, "Last time (" + shortFmt.format(last.ts) + "): " + describeSets(last, e.unit)) : h("span", { class: "prev" }, "First time: start with a weight you can repeat comfortably."),
          h("a", { class: "vid", href: videoUrl(e), target: "_blank", rel: "noopener" }, "▶ Video"),
          h("button", { class: "vid", type: "button", style: "border:0;background:none;padding:0", onclick: () => { const top = wEls.body.scrollTop; openExercise(e.id, null, () => openWorkout(top)); } }, "ⓘ Details"),
          complete ? null : h("button", { class: "vid", type: "button", style: "border:0;background:none;padding:0", onclick: () => openSwap(i, wEls.body.scrollTop) }, "⇄ Swap")),
        en.planned.note ? h("div", { class: "hint" }, en.planned.note) : null,
        h("div", { class: "sets" },
          h("div", { class: "set-labels" }, h("span", {}, "#"), h("span", {}, "kg"), h("span", {}, unitLabel(e.unit)), h("span", {}, "")),
          en.sets.map((st, k) => {
            const row = h("div", { class: "set" + (st.done ? " done" : "") },
              h("span", { class: "n" }, String(k + 1)),
              stepper(st.kg, e.step || 1, 1, `set ${k + 1} weight`, (v) => { st.kg = v; saveW(); if (st.done) scheduleAutosave(); }),
              stepper(st.reps, e.unit === "sn" ? 5 : 1, 0, `set ${k + 1} ${unitLabel(e.unit)}`, (v) => { st.reps = v; saveW(); if (st.done) scheduleAutosave(); }),
              h("button", { class: "tick", type: "button", "aria-pressed": String(st.done), "aria-label": `Set ${k + 1} done`, onclick: () => {
                st.done = !st.done;
                if (st.done) {
                  // Create/resume audio inside the tap so iOS lets the rest-timer beep play later.
                  if (S.sound) { try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch {} }
                  // carry this set's numbers into the next untouched set
                  const nx = en.sets[k + 1]; if (nx && !nx.done) { if (st.kg !== "") nx.kg = st.kg; }
                  const rest = +en.planned.rest || 0;
                  const lastSetOfAll = doneCount() === totalCount();
                  if (S.autoRest && rest > 0 && !lastSetOfAll) R = { endAt: Date.now() + rest * 1000, total: rest * 1000, rang: false };
                  if (en.sets.every((x) => x.done)) { delete W.open[i]; }
                } else R = null;
                W.lastAt = Date.now();
                saveW(); autosaveNow(); renderWorkoutBody(st.done && en.sets.every((x) => x.done)); updateWorkoutChrome();
              } }, "✓"));
            return row;
          })),
        h("div", { class: "row", style: "justify-content:flex-start" },
          h("button", { class: "btn small", type: "button", onclick: () => { const lastSet = en.sets[en.sets.length - 1] || {};
            en.sets.push({ kg: lastSet.kg ?? "", reps: lastSet.reps ?? "", done: false }); delete W.open[i]; saveW(); renderWorkoutBody(); } }, "+ Add set"),
          en.sets.length > 1 && !en.sets[en.sets.length - 1].done ? h("button", { class: "btn ghost small", type: "button", onclick: () => { en.sets.pop(); saveW(); renderWorkoutBody(); } }, "Remove last set") : null));
    });
    const intro = doneCount() === 0 ? h("p", { class: "hint", style: "margin:0" }, "Boxes start with last time's numbers. Adjust with − / +, tap ✓ when a set is done, and the rest timer starts on its own. Each ✓ is saved right away, so closing the app keeps the sets you've done.") : null;
    const allDone = doneCount() === totalCount() && totalCount() > 0;
    wEls.body.replaceChildren(...[intro, ...cards, allDone ? h("div", { class: "notice tip" }, "All sets done. Tap “Finish workout” to save.") : null].filter(Boolean));
    wEls.body.scrollTop = keep;
    if (scrollToCurrent) {
      const target = cur >= 0 ? document.getElementById("wex-" + cur) : wEls.body.lastElementChild;
      if (target) requestAnimationFrame(() => target.scrollIntoView({ block: "start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }));
    }
  }

  async function finishWorkout() {
    const sess = sessionFromW(false), entries = sess.entries;
    if (!entries.length) { toast("No completed sets yet. Tap ✓ on the sets you've done."); return; }
    clearTimeout(autosaveTimer); autosaveTimer = null;
    const prs = entries.map((en) => { const top = Math.max(...en.sets.map((x) => x.kg)); const before = bestKg(en.ex, sess.ts + 1);
      return top > 0 && top > before && before > 0 ? { e: EXBY[en.ex], top, before } : null; }).filter(Boolean);
    const vol = entries.reduce((a, en) => a + en.sets.reduce((b, st) => b + st.kg * st.reps, 0), 0);
    const sets = entries.reduce((a, en) => a + en.sets.length, 0);
    W = null; R = null; saveW();
    let saved = true;
    try { await Store.saveSession(sess); } catch { saved = false; }
    const body = [
      h("div", { class: "busy", style: "padding:18px 0 4px" }, h("strong", { class: "disp", style: "font-size:32px;line-height:1" }, saved ? "Nice work!" : "Couldn't save"),
        h("span", { class: "hint" }, saved ? sess.dayTitle + " saved." : "Check your connection. The workout couldn't be saved on this device.")),
      h("div", { class: "card summary-big" },
        h("div", {}, h("div", { class: "v num" }, String(sess.minutes)), h("div", { class: "label" }, "minutes")),
        h("div", {}, h("div", { class: "v num" }, String(sets)), h("div", { class: "label" }, "sets")),
        h("div", {}, h("div", { class: "v num" }, nf0.format(vol)), h("div", { class: "label" }, "kg total"))),
      prs.length ? h("section", { class: "card stack", style: "gap:4px" }, h("span", { class: "label" }, "New records 🏆"),
        h("div", { class: "pr-list" }, prs.map((x) => h("div", { class: "pr" }, h("span", {}, x.e.name), h("span", { class: "w num" }, `${fmtKg(x.before)} → ${fmtKg(x.top)} kg`))))) : null,
    ];
    showSheet("Workout complete", body, h("div", { class: "sheet-foot one" }, h("button", { class: "btn primary big", type: "button", onclick: () => { S.tab = "progress"; lsSet("tab", S.tab); closeSheet(); } }, "See progress")));
  }

  // ---------- Wiring ----------
  for (const b of document.querySelectorAll(".nav button")) b.addEventListener("click", () => {
    S.tab = b.dataset.tab; lsSet("tab", S.tab); render(); window.scrollTo({ top: 0 });
  });
  render();
  Store.init();
})();
</script>

</body></html>
