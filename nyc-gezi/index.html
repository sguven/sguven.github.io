<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E2A3B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NYC Gezi">
<title>New York: Salı ve Çarşamba</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E2A3B'/%3E%3Cpath d='M10 40h44l-6 10H16z' fill='%23F28C28'/%3E%3Cpath d='M22 40V28h20v12' fill='none' stroke='%237CC4B0' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --harbor:#0E2A3B;      /* liman laciverti */
  --harbor-2:#173D54;
  --patina:#2F8C76;      /* heykelin bakır yeşili */
  --patina-soft:#DDF0EA;
  --ferry:#F28C28;       /* vapur turuncusu */
  --ferry-soft:#FDEBD6;
  --fog:#EDF1F1;         /* liman sisi */
  --card:#FFFFFF;
  --ink:#10222D;
  --muted:#5C6E78;
  --line:#D5DEE0;
  --on-harbor:#F3F7F7;
  --on-harbor-muted:#A9C0CB;
  --display:"Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
  --body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --fog:#081721; --card:#0F2634; --ink:#E8EFF1; --muted:#93A8B3; --line:#1F3B4C;
    --patina:#5DBCA4; --patina-soft:#123B36; --ferry-soft:#3C2A14; --harbor:#06131B; --harbor-2:#123247;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fog);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-bottom:calc(32px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
b{font-weight:700}
:focus-visible{outline:3px solid var(--ferry);outline-offset:2px;border-radius:6px}
.wrap{max-width:620px;margin:0 auto;padding:0 16px}

/* Üst şerit */
.top{position:sticky;top:0;z-index:10;background:var(--harbor);color:var(--on-harbor);
  padding:calc(10px + env(safe-area-inset-top)) 0 0}
.top-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.top-title{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em}
.clock{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.clock small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--on-harbor-muted);margin-left:6px;letter-spacing:0}
.progress{margin-top:8px;display:flex;align-items:center;gap:10px;padding-bottom:10px}
.bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ferry);border-radius:3px;transition:width .35s ease}
.count{font-size:13px;color:var(--on-harbor-muted);font-variant-numeric:tabular-nums;white-space:nowrap}

.days{display:flex;gap:4px;background:rgba(255,255,255,.1);border-radius:12px;padding:3px}
.days button{border:0;background:none;color:var(--on-harbor-muted);font-family:var(--display);font-weight:700;font-size:15px;
  padding:8px 12px;border-radius:9px;min-height:40px;white-space:nowrap}
.days button[aria-pressed="true"]{background:var(--ferry);color:#231200}
.top-row{align-items:center}
.clock small{display:block;margin:0;text-align:right;line-height:1.1}
.clock{text-align:right;line-height:1.05}

/* Sıradaki adım */
.now{background:var(--harbor);color:var(--on-harbor);padding:10px 0 26px;border-radius:0 0 26px 26px}
.now-label{font-size:14px;color:var(--on-harbor-muted);font-weight:500}
.now-time{font-family:var(--display);font-weight:800;font-size:clamp(64px,22vw,104px);line-height:.9;
  letter-spacing:-.05em;font-variant-numeric:tabular-nums;margin:6px 0 10px -3px}
.now-title{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.12;letter-spacing:-.02em;margin:0}
.now-place{color:var(--on-harbor-muted);font-size:15px;margin:6px 0 0}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:7px 12px;border-radius:999px;
  font-size:14px;font-weight:600;background:rgba(255,255,255,.1)}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--on-harbor-muted)}
.status.ok::before{background:#7CC4B0}
.status.soon::before{background:#FFD08A}
.status.late{background:var(--ferry);color:#231200}
.status.late::before{background:#231200}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:16px;min-height:50px;
  text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-main{background:var(--ferry);color:#231200;flex:1 1 200px}
.btn-main:active{transform:translateY(1px)}
.btn-ghost{background:rgba(255,255,255,.12);color:var(--on-harbor)}
.btn-line{background:transparent;border:1.5px solid rgba(255,255,255,.35);color:var(--on-harbor);width:100%}

/* Detay kartı */
.detail{background:var(--card);border-radius:20px;margin-top:-14px;padding:18px 18px 8px;position:relative;
  box-shadow:0 10px 30px -18px rgba(14,42,59,.55)}
.intro{margin:0 0 6px;font-size:15.5px}
.dur{margin:0 0 12px;font-size:14px;color:var(--muted);font-weight:500}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:15.5px}
.steps .t{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px;line-height:1.55}
.steps li.cur{margin:0 -10px;padding:11px 10px;background:var(--ferry-soft);border-radius:12px;border-top-color:transparent}
.steps li.cur + li{border-top-color:transparent}
.steps li.cur .t{color:var(--ink)}
.steps li.past{opacity:.55}
.warn{margin:12px 0;padding:12px 14px;border-left:4px solid var(--ferry);background:var(--ferry-soft);border-radius:0 12px 12px 0;font-size:15px}
.warn strong{display:block;font-size:13.5px;margin-bottom:2px}
.food{margin:12px 0;padding:12px 14px;background:var(--patina-soft);border-radius:12px;font-size:15px}
.food h4{margin:0;font-size:15.5px;font-family:var(--display);font-weight:700}
.food .addr{font-size:13.5px;color:var(--muted);margin:1px 0 6px}
.food p{margin:0}
.maplink{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14.5px;color:var(--patina);
  text-decoration:underline;text-underline-offset:3px;padding:8px 0 10px}

/* Gün çizelgesi */
h2{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.02em;margin:30px 0 4px}
.sub{margin:0 0 12px;color:var(--muted);font-size:14.5px}
.list{list-style:none;margin:0;padding:0;position:relative}
.item{position:relative;padding-left:44px}
.item::before{content:"";position:absolute;left:14px;top:0;bottom:0;width:2px;background:var(--line)}
.item:first-child::before{top:26px}
.item:last-child::before{bottom:calc(100% - 26px)}
.item.done::before{background:var(--patina)}
.check{position:absolute;left:0;top:11px;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);
  background:var(--card);display:grid;place-items:center;padding:0;z-index:1}
.check svg{width:16px;height:16px;opacity:0;transform:scale(.5);transition:.18s ease}
.item.done .check{background:var(--patina);border-color:var(--patina)}
.item.done .check svg{opacity:1;transform:none}
.item.next .check{border-color:var(--ferry);box-shadow:0 0 0 4px var(--ferry-soft)}
.head{display:grid;grid-template-columns:52px 1fr 20px;gap:8px;align-items:baseline;width:100%;text-align:left;
  background:none;border:0;padding:14px 0;border-bottom:1px solid var(--line)}
.head .t{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;font-size:15.5px}
.head .n{font-weight:600;font-size:16px;line-height:1.3}
.head .n small{display:block;font-weight:400;font-size:13.5px;color:var(--muted);margin-top:1px}
.head .c{color:var(--muted);transition:transform .2s;justify-self:end;align-self:center}
.item.open .head .c{transform:rotate(180deg)}
.item.done .head .n{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.item.done .head .t{color:var(--muted)}
.item.next .head .t{color:var(--ferry)}
.item.clock .head .n::after{content:"saate göre şimdi";display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;
  background:var(--harbor-2);color:#F3F7F7;font-size:11.5px;font-weight:600;text-decoration:none;vertical-align:2px}
.body{display:none;padding:12px 0 4px}
.item.open .body{display:block}

.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.fact{background:var(--card);border-radius:14px;padding:12px 14px;font-size:14.5px}
.fact b{display:block;font-family:var(--display);font-size:16px}
.fact.wide{grid-column:1/-1}
.tips{background:var(--card);border-radius:14px;padding:4px 16px;margin-top:10px}
.tips summary{font-weight:700;padding:12px 0;cursor:pointer}
.tips ul{margin:0;padding:0 0 12px 18px;font-size:15px}
.tips li{margin:6px 0}
.routes{display:grid;gap:8px;margin-top:10px}
.routes a{background:var(--card);border-radius:14px;padding:13px 16px;text-decoration:none;font-weight:600;font-size:15px;
  display:flex;justify-content:space-between;gap:10px;align-items:center}
.routes a span{color:var(--patina);white-space:nowrap;font-size:14px}
.foot{margin-top:28px;text-align:center}
.reset{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:14px;padding:10px}
.finish{text-align:left}
.finish .now-time{font-size:clamp(48px,15vw,72px)}

/* yürürken okunabilirlik */
.short{font-size:20px;line-height:1.35;font-weight:600;margin:14px 0 0;max-width:30em}
.short-in{font-size:17.5px;line-height:1.4;font-weight:600;margin:0 0 10px}
.btn-main,.btn-ghost{flex:1 1 100%}
.steps li{font-size:17px;line-height:1.5;grid-template-columns:64px 1fr;padding:13px 0}
.steps li.cur{padding:13px 10px}
.steps .t{font-size:16px}
.intro{font-size:16.5px}
.btn-back{flex:1 1 100%;background:transparent;color:var(--on-harbor-muted);min-height:44px;padding:8px 12px;font-size:15px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.path{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 0;font-size:15px;font-weight:600}
.path li{display:flex;align-items:center}
.path li:not(:last-child)::after{content:"";width:7px;height:7px;border-top:2px solid currentColor;border-right:2px solid currentColor;transform:rotate(45deg);margin:0 11px 0 7px;opacity:.55}
.path li:last-child{background:var(--ferry);color:#231200;padding:2px 10px;border-radius:999px}
.now .path{color:var(--on-harbor-muted)}
.body .path{margin:0 0 12px;color:var(--muted)}
.mapbtn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;margin:12px 0 10px;border-radius:14px;
  background:var(--patina);color:#fff;font-weight:700;font-size:16px;text-decoration:none}
.mapbtn.small{min-height:44px;margin:10px 0 0;font-size:15px}
.head .n{font-size:17px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="days" id="days" role="group" aria-label="Gün seç"></div>
      <div class="clock" aria-live="off"><span id="clock">--:--</span><small>New York saati</small></div>
    </div>
    <div class="progress">
      <div class="bar" aria-hidden="true"><i id="bar"></i></div>
      <div class="count" id="count"></div>
    </div>
  </div>
</header>

<section class="now" aria-live="polite">
  <div class="wrap" id="now"></div>
</section>

<main class="wrap">
  <div id="detail"></div>

  <h2>Günün tamamı</h2>
  <p class="sub">Yuvarlağa dokunarak işaretle; yanlış bastıysan tekrar dokun, işaret kalkar. Satıra dokununca detayı açılır.</p>
  <ol class="list" id="list"></ol>

  <h2 id="factsTitle">Bugün için</h2>
  <div class="facts" id="facts"></div>

  <div class="routes" id="routes"></div>

  <details class="tips">
    <summary>Bilmen gerekenler</summary>
    <ul id="tips"></ul>
  </details>

  <div class="foot">
    <button class="reset" id="reset">İşaretleri sıfırla</button>
  </div>
</main>

<script>
const gm = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
const nav = q => "https://www.google.com/maps/dir/?api=1&travelmode=walking&destination=" + encodeURIComponent(q);
const mapOf = s => s.dir ? dirURL(s.dir) : (s.walk ? nav(s.map) : gm(s.map));
const mapLabel = s => s.dir ? (s.dir.m === "transit" ? "Metro güzergahını Google Maps'te aç" : "Yürüyüş güzergahını Google Maps'te aç") : (s.walk ? "Google Maps'te yürüyüş tarifi" : "Google Maps'te aç");
const route = pts => "https://www.google.com/maps/dir/?api=1&travelmode=walking&origin=" + encodeURIComponent(pts[0]) +
  "&destination=" + encodeURIComponent(pts[pts.length-1]) +
  (pts.length > 2 ? "&waypoints=" + encodeURIComponent(pts.slice(1,-1).join("|")) : "");

const STOPS_SALI = [
 {id:"metro", short:"2 ya da 3 numaralı tren, Downtown yönü. 6. durak Wall St'te in.", t:"09:45", title:"Metroyla Financial District'e", place:"Times Sq–42 St durağı → Wall St durağı (2 ya da 3 numaralı hat)",
  map:"Times Sq-42 St Station New York", dur:"Yol toplam 25–30 dk",
  intro:"Port Authority'ye 09:30'da da 10:00'da da varsan yetişirsin: önemli olan 12:00–12:30 arası Battery Park'ta olmak. 10:00'dan sonra çıktıysan kahvaltıyı atlama, onun yerine Oculus'un içini atla.",
  steps:[["09:45","Port Authority'den çık. 42. sokaktan doğuya 5 dakika yürü ya da terminalin içindeki yer altı geçidini izle: <b>Times Sq–42 St</b> durağı."],
         ["09:53","Kırmızı renkli <b>2</b> ya da <b>3</b> numaralı ekspres trene bin. Tabelada <b>Downtown &amp; Brooklyn</b> yazan peron."],

  warn:"1 numaralı tren de aynı perondan geçer ama yereldir ve Wall St'te durmaz. Yanlışlıkla binersen son durak South Ferry'de in; Battery Park'ın içindesin, kahvaltıya oradan 8 dakika yürürsün."},

 {id:"kahvalti", short:"Doyurucu bir bagel ye; öğle yemeği adada ve geç. 10:40'ta kalk.", walk:true, t:"10:15", title:"Kahvaltı: Leo's Bagels", place:"3 Hanover Square (Stone Street köşesi)",
  map:"Leo's Bagels 3 Hanover Square New York",
  intro:"Elde açılıp kazanda haşlanan, gün boyu taze çıkan klasik New York bagel'ı. Hafta içi 06:00–16:00 açık. Bugün öğle yemeği 14:00'e kalıyor, o yüzden burada iyi doy.",

         ["10:20","İçeride yer azdır. Paket alıp meydandaki banklarda ya da Stone Street'te yiyebilirsin."],
         ["10:40","Kalk. Vapur sırası için yanına bir atıştırmalık da alabilirsin."]],
  foods:[["Financier Patisserie (kruvasan istersen)","62 Stone St, Leo's'tan 1 dakika","Financier Patisserie 62 Stone St New York",
          "Fransız pastanesi: kruvasan, pain au chocolat, kahvenin yanında minik financier keki. Bugünkü saati doğrulanmadı; kapalıysa Leo's yeter."]]},

 {id:"wall", short:"Federal Hall, borsa, Trinity Church. Sonra Broadway'den kuzeye, anıt havuzlarına.", walk:true, t:"10:45", title:"Wall Street", place:"Wall St ve Broad St köşesi",

 {id:"oculus", short:"İki havuz ve Survivor Tree, sonra beyaz kanatlı Oculus'un içi. Müze akşama.", walk:true, t:"11:10", title:"Anıt havuzları + Oculus", place:"World Trade Center; Oculus kuzeydoğu köşede",

  foods:[["Eataly Downtown","4 World Trade Center, 3. kat (101 Liberty St)","Eataly NYC Downtown 101 Liberty St",

 {id:"boga", short:"Broadway'den güneye, boğada 5 dakika fotoğraf, sonra su kenarındaki yuvarlak kaleye yürü.", walk:true, t:"11:35", title:"Charging Bull'dan geçerek Battery Park'a", place:"Oculus → Broadway → Bowling Green → Battery Park",

  intro:"Boğa heykeli öğlene doğru kalabalıktır; fotoğraf için kısa bir sıra olabilir, 5 dakikadan fazla bekleme.",

 {id:"feribot", short:"12:30 biletinin QR kodunu aç, güvenlikten geç, ilk kalkan vapura bin. Güvertede sağda dur.", walk:true, t:"12:00", title:"Feribot: güvenlik ve biniş (12:30 bileti)", place:"Battery Park, Castle Clinton'ın yanı, su kenarı",
  map:"Castle Clinton National Monument Battery Park",

  });
  if (s.back) h += `<a class="mapbtn small" href="${dirURL(s.back)}" target="_blank" rel="noopener">${PIN}Dönüş güzergahı: Port Authority'ye</a>`;
  if (inList) h += `<a class="mapbtn" href="${mapOf(s)}" target="_blank" rel="noopener">${PIN}${mapLabel(s)}</a>`;
  return h;
}

function render(){
  const now = nyNow();
  const tripDay = now.date === TRIP_DATE;
  const before = now.date < TRIP_DATE;
  const nx = nextStop();
  const cs = tripDay ? clockStop(now) : null;

  $("clock").textContent = fmt(now.min);
  $("days").innerHTML = ORDER.map(k => `<button data-k="${k}" aria-pressed="${k === D.id}">${DAYS[k].tab}</button>`).join("");
  $("factsTitle").textContent = tripDay ? "Bugün için" : DAYS[D.id].tab.split(" ")[0] + " için";
  $("facts").innerHTML = D.facts.map(f => `<div class="fact${f[2] ? " wide" : ""}"><b>${f[0]}</b>${f[1]}</div>`).join("");
  $("routes").innerHTML = ROUTES.map(r => `<a href="${route(r[1])}" target="_blank" rel="noopener">${r[0]}<span>Rotayı aç</span></a>`).join("");
  $("tips").innerHTML = TIPS.map(t => `<li>${t}</li>`).join("");
  $("bar").style.width = (done.size / STOPS.length * 100) + "%";
  $("count").textContent = `${done.size} / ${STOPS.length} adım`;

  const prev = (() => { const i = nx ? STOPS.indexOf(nx) : STOPS.length; for (let k = i-1; k >= 0; k--) if (done.has(STOPS[k].id)) return STOPS[k]; return null; })();
  /* sıradaki adım */
  if (!nx){
    $("now").innerHTML = `<div class="finish"><div class="now-label">Bütün adımlar tamam</div>
      <div class="now-time">Gün bitti</div>
      <p class="now-place">${D.finish}</p>
      <div class="actions">${prev ? `<button class="btn btn-back" id="backBtn">${BACK}Geri al: ${prev.t} adımına dön</button>` : ""}</div></div>`;
    $("detail").innerHTML = "";
  } else {
    let cls = "", msg = "", catchup = "";
    if (before){ msg = D.startMsg; }
    else if (!tripDay){ msg = "Gezi günü geçti; liste yine de kullanılabilir"; }
    else if (now.min < nx.start){
      const d = nx.start - now.min; cls = d <= 10 ? "soon" : "ok";
      msg = done.size ? `Planın ${span(d)} önündesin` : `Başlamasına ${span(d)} var`;
      if (done.size && d <= 10) msg = `${span(d)} sonra başlıyor`;
    } else if (now.min < nx.end){
      const d = nx.end - now.min; cls = d <= 10 ? "soon" : "ok";
      const after = STOPS[STOPS.indexOf(nx)+1];
      msg = after ? `Zamanındasın. ${span(d)} sonra: ${after.t} ${after.title.split(":")[0]}` : "Zamanındasın";
    } else {
      cls = "late"; msg = `Plana göre ${span(now.min - nx.end)} geridesin`;
      if (cs && cs !== nx && !done.has(cs.id))
        catchup = `<button class="btn btn-line" id="catchup">Öncekileri yapıldı say, ${cs.t} adımına geç</button>`;
    }
    $("now").innerHTML = `
      <div class="now-label">${done.size ? "Sıradaki adım" : "İlk adım"}</div>
      <div class="now-time">${nx.t}</div>
      <h1 class="now-title">${nx.title}</h1>
      <p class="now-place">${nx.place}</p>
      <p class="short">${nx.short}</p>
      ${pathHTML(nx)}
      <div class="status ${cls}">${msg}</div>
      <div class="actions">
        <button class="btn btn-main" id="doneBtn">Yaptım, sıradakine geç</button>
        <a class="btn btn-ghost" href="${mapOf(nx)}" target="_blank" rel="noopener">${PIN}${mapLabel(nx)}</a>
        ${catchup}
        ${prev ? `<button class="btn btn-back" id="backBtn">${BACK}Geri al: ${prev.t} adımına dön</button>` : ""}
      </div>`;
    $("detail").innerHTML = `<div class="detail">${detailHTML(nx, now, tripDay && now.min < nx.end)}</div>`;
    $("doneBtn").onclick = () => { done.add(nx.id); save(); openId = null; render(); window.scrollTo({top:0, behavior:"smooth"}); };
    const cu = $("catchup");
    if (cu) cu.onclick = () => { for (const s of STOPS){ if (s === cs) break; done.add(s.id); } save(); render(); };
  }

  const bb = $("backBtn");
  if (bb) bb.onclick = () => { done.delete(prev.id); save(); openId = null; render(); window.scrollTo({top:0, behavior:"smooth"}); };

  /* liste */
  $("list").innerHTML = STOPS.map(s => {
    const c = ["item"];
    if (done.has(s.id)) c.push("done");
    if (nx && s === nx) c.push("next");
    if (cs && s === cs && !done.has(s.id) && s !== nx) c.push("clock");
    if (openId === s.id) c.push("open");
    return `<li class="${c.join(" ")}" data-id="${s.id}">
      <button class="check" aria-pressed="${done.has(s.id)}" aria-label="${s.title}: ${done.has(s.id) ? "yapıldı, geri al" : "yapıldı olarak işaretle"}">${CHECK}</button>
      <button class="head" aria-expanded="${openId === s.id}"><span class="t">${s.t}</span><span class="n">${s.title}<small>${s.place}</small></span>${CHEV}</button>
      <div class="body">${openId === s.id ? detailHTML(s, now, false, true) : ""}</div>
    </li>`;
  }).join("");
}

$("list").addEventListener("click", e => {
  const li = e.target.closest(".item"); if (!li) return;
  const id = li.dataset.id;
  if (e.target.closest(".check")){ done.has(id) ? done.delete(id) : done.add(id); save(); render(); }
  else if (e.target.closest(".head")){ openId = openId === id ? null : id; render(); }
});
let armed = 0;
$("reset").onclick = () => {
  if (Date.now() - armed < 4000){ done.clear(); save(); openId = null; armed = 0; $("reset").textContent = "İşaretleri sıfırla"; render(); window.scrollTo({top:0}); }
  else { armed = Date.now(); $("reset").textContent = "Emin misin? Silmek için tekrar dokun"; setTimeout(() => { if (armed){ armed = 0; $("reset").textContent = "İşaretleri sıfırla"; } }, 4000); }
};

$("days").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.dataset.k === D.id) return;
  setDay(b.dataset.k); openId = null;
  try { localStorage.setItem(DAYPICK, JSON.stringify({k:D.id, on:nyNow0().date})); } catch(e){}
  render(); window.scrollTo({top:0});
});

render();
setInterval(render, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
</script>
</body>
</html>
