<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hanzi Workshop</title>
<meta name="description" content="Hanzi Workshop: a tablet-first Mandarin course with tones, pinyin, stroke order and handwriting practice with a pen. Chapter 1 (HSK 1 foundations).">
<meta property="og:title" content="Hanzi Workshop">
<meta property="og:description" content="A tablet-first Mandarin course with handwriting practice: tones, pinyin, stroke order and your first characters.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://sguven.github.io/hanzi-workshop/">
<meta property="og:image" content="https://sguven.github.io/img/thumbs/hanzi.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: lesson list on the left and workspace on the right on a landscape tablet; top bar + drawer on narrow screens.
   World: rice paper + ink, jade accent; cinnabar red only for seals (completed). */
:root{
  --paper:#eceee8; --card:#f8f9f5; --ink:#1c2320; --muted:#5b6660; --line:#d2d8d0;
  --jade:#21705e; --jade-soft:#d9ebe4; --seal:#b3352b; --outline:#dfe3dc; --ghost:#c9cfc6; --grid:#d9a59f;
  --ok:#1f8a4c; --bad:#c0392b;
  --t1:#c8372d; --t2:#c27510; --t3:#1d8a4b; --t4:#2c5cc5; --t5:#7d8782;
  --f-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-zh:"Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --f-cal:"Ma Shan Zheng", "Kaiti SC", "STKaiti", "KaiTi", serif;
  --r:14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111614; --card:#19201d; --ink:#e4e9e5; --muted:#99a49e; --line:#2c3531;
    --jade:#5cbfa5; --jade-soft:#1f3a33; --seal:#e0665b; --outline:#2a322e; --ghost:#34403b; --grid:#6b3f3a;
    --ok:#4fc583; --bad:#ef7468;
    --t1:#f0766b; --t2:#f0a64a; --t3:#5bcb86; --t4:#7ba2f2; --t5:#8e9a94;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111614; --card:#19201d; --ink:#e4e9e5; --muted:#99a49e; --line:#2c3531;
  --jade:#5cbfa5; --jade-soft:#1f3a33; --seal:#e0665b; --outline:#2a322e; --ghost:#34403b; --grid:#6b3f3a;
  --ok:#4fc583; --bad:#ef7468;
  --t1:#f0766b; --t2:#f0a64a; --t3:#5bcb86; --t4:#7ba2f2; --t5:#8e9a94;
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.75rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:800}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
a{color:var(--jade)}
:focus-visible{outline:3px solid var(--jade);outline-offset:2px;border-radius:6px}
.zh{font-family:var(--f-zh)}
.cal{font-family:var(--f-cal);font-weight:400}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}
.neutral span{color:inherit!important}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* app shell */
.app{display:grid;grid-template-columns:288px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;border-right:1px solid var(--line);background:var(--card);padding:20px 14px 16px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px;text-decoration:none;color:inherit}
.brand .mark{width:42px;height:42px;border-radius:10px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--f-cal);font-size:28px;line-height:1}
.brand b{display:block;font-weight:800;font-size:1.02rem}
.brand span{display:block;font-size:.78rem;color:var(--muted)}
.prog{padding:0 6px}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--jade);border-radius:99px;transition:width .4s}
.navh{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 8px 0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;padding:9px 8px;border-radius:10px;text-decoration:none;color:inherit;min-height:46px}
.nav a:hover{background:var(--paper)}
.nav a.on{background:var(--jade-soft)}
.nav .num{font-size:.8rem;font-weight:700;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.nav .lt{display:flex;flex-direction:column;line-height:1.25}
.nav .lt b{font-weight:600;font-size:.92rem}
.nav .lt span{font-family:var(--f-zh);font-size:.78rem;color:var(--muted)}
.seal{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:4px;background:var(--seal);color:#fff;font-family:var(--f-cal);font-size:16px;line-height:1;transform:rotate(-6deg);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.lock{width:18px;height:18px;color:var(--muted)}
.side-foot{margin-top:auto;font-size:.78rem;color:var(--muted);padding:8px 8px 0;border-top:1px solid var(--line)}
.topbar{display:none}
main{min-width:0;padding:28px clamp(16px,3.5vw,44px) 60px;max-width:1120px;width:100%}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(86vw,320px);z-index:30;transform:translateX(-105%);transition:transform .25s;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  body.drawer .side{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25;display:none}
  body.drawer .scrim{display:block}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
  .topbar .brand .mark{width:34px;height:34px;font-size:22px}
  main{padding-top:20px}
}

/* shared components */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink);touch-action:manipulation}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--jade);border-color:var(--jade);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0d1513}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0d1513}}
.btn.primary:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:38px;padding:6px 12px;font-size:.88rem;border-radius:10px}
.btn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.icon{width:20px;height:20px;flex:none}
.say{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--jade);flex:none;vertical-align:middle;touch-action:manipulation}
.say:hover{border-color:var(--jade)}
.say svg{width:18px;height:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:var(--paper);border:1px solid var(--line);font-size:.8rem;font-weight:600;color:var(--muted)}
.chip.jade{background:var(--jade-soft);border-color:transparent;color:var(--jade)}
.chip.seal{background:transparent;border-color:var(--seal);color:var(--seal);width:auto;height:auto;transform:none;box-shadow:none;font-family:var(--f-body);font-size:.8rem}
.lead{font-size:1.05rem;color:var(--muted);max-width:65ch}
.prose{max-width:68ch}
.prose p+p{margin-top:10px}
.note{border-left:3px solid var(--jade);background:var(--jade-soft);padding:12px 14px;border-radius:0 10px 10px 0;font-size:.95rem}
.note.warn{border-color:var(--t2);background:color-mix(in srgb,var(--t2) 12%,var(--card))}
.sec{display:flex;flex-direction:column;gap:14px;margin-top:30px}
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-h .zh{font-size:1.1rem;color:var(--muted)}

/* lesson header */
.lhead{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;margin-bottom:8px}
.lhead .big{font-family:var(--f-cal);font-size:clamp(54px,8vw,84px);line-height:1;color:var(--ink);min-width:1.2em}
.lhead .meta{display:flex;flex-direction:column;gap:6px}
.lfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:36px;padding-top:18px;border-top:1px solid var(--line)}

/* tianzige */
.tz{position:relative;background:var(--card);border:2px solid var(--grid);border-radius:4px;touch-action:none;user-select:none;-webkit-user-select:none;flex:none}
.tz>svg.grid{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tz>svg.grid line{stroke:var(--grid);stroke-width:.5;stroke-dasharray:2 2;vector-effect:non-scaling-stroke}
.tz .hw,.tz canvas,.tz .ghost{position:absolute;inset:0}
.tz .ghost{pointer-events:none;display:grid;place-items:center}
.tz .ghost svg{width:100%;height:100%}
.tz .ghost path{fill:var(--ghost)}
.tz .ghost .gtxt{font-family:var(--f-cal);color:var(--ghost);line-height:1}
.tz canvas{width:100%;height:100%;touch-action:none}

/* tone chart */
.tones svg{width:100%;max-width:520px;height:auto}
.tones text{fill:var(--muted);font-size:12px;font-family:var(--f-body)}
.tonecards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.tc{display:flex;gap:14px;align-items:flex-start}
.tc .py{font-size:1.9rem;font-weight:800;line-height:1}
.tc .hz{font-family:var(--f-zh);font-size:1.4rem}

/* sounds */
.snd{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.snd .card{padding:14px 16px;display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center}
.snd .k{font-size:1.6rem;font-weight:800;text-align:center}
.snd .d{font-size:.9rem}
.snd .ex{font-family:var(--f-zh);font-size:.9rem;color:var(--muted)}

/* stroke cards */
.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.stk button.card{cursor:pointer;text-align:left;padding:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;position:relative}
.stk button.card.on{border-color:var(--jade);box-shadow:0 0 0 2px var(--jade) inset}
.stk .mini{width:96px;height:96px}
.stk .nm{display:flex;align-items:baseline;gap:6px}
.stk .nm .zh{font-size:1.3rem}
.stk .done{position:absolute;top:10px;right:10px}

/* studio */
.studio{display:grid;grid-template-columns:auto minmax(240px,1fr);gap:22px;align-items:start}
@media (max-width:760px){.studio{grid-template-columns:1fr}}
.studio .left{display:flex;flex-direction:column;gap:12px;align-items:center}
.ctabs{display:flex;gap:8px;flex-wrap:wrap}
.ctab{position:relative;width:56px;height:62px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-family:var(--f-zh);font-size:1.6rem;display:grid;place-items:center;padding-bottom:6px}
.ctab.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.ctab .dots{position:absolute;bottom:6px;left:0;right:0;display:flex;justify-content:center;gap:4px}
.ctab .dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.ctab .dots i.g{background:var(--jade)}
.ctab .dots i.m{background:var(--seal)}
.modes{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.info .hz{font-family:var(--f-zh);font-size:3rem;line-height:1}
.info .pyl{font-size:1.6rem;font-weight:800}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.95rem}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0}
.fb{min-height:1.6em;font-weight:600}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.pad-tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:6px 12px;min-height:38px;font-weight:700;font-size:.88rem;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--paper)}
.claudefb{white-space:pre-wrap;font-size:.95rem}

/* rules */
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.rule{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;padding:14px}
.rule .mini{width:110px;height:110px}
.rule b.zh{font-size:.95rem;color:var(--muted);font-weight:500}

/* dialogue */
.dlg{display:flex;flex-direction:column;gap:10px}
.line{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:12px 14px}
.line .who{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.85rem;background:var(--paper);border:1px solid var(--line)}
.line.b .who{background:var(--jade-soft);color:var(--jade);border-color:transparent}
.line .h{font-family:var(--f-zh);font-size:1.35rem;line-height:1.3}
.line .p{font-weight:600}
.line .t{color:var(--muted);font-size:.92rem}
.gram{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.gram .card h3{display:flex;gap:8px;align-items:baseline}
.ex{font-family:var(--f-zh)}

/* quiz */
.qz{display:flex;flex-direction:column;gap:14px}
.qz-top{display:flex;justify-content:space-between;font-size:.85rem;font-weight:700;color:var(--muted)}
.qz-q{font-size:1.15rem;font-weight:700}
.qz-q .zh{font-size:2.2rem;font-weight:500;display:block;margin:6px 0 2px}
.qz-q .bigpy{font-size:2rem;font-weight:800;display:block;margin:6px 0 2px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.opt{min-height:56px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600;cursor:pointer;text-align:left;font-size:1rem;touch-action:manipulation}
.opt:hover:not([disabled]){border-color:var(--jade)}
.opt .zh{font-size:1.3rem}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.opt.picked{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink) inset}
.opt[disabled]{cursor:default}
.qz-fb{min-height:1.4em}
.qz-fb .ok{color:var(--ok)}.qz-fb .bad{color:var(--bad)}
.qz-nav{display:flex;justify-content:flex-end;gap:10px}
.order-ans{min-height:64px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.order-pool{display:flex;gap:8px;flex-wrap:wrap}
.tok{min-height:52px;min-width:52px;padding:6px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-family:var(--f-zh);font-size:1.4rem;cursor:pointer}
.tok.used{visibility:hidden}

/* flashcard */
.fc{width:min(100%,380px);aspect-ratio:4/3;border-radius:18px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;text-align:center;cursor:pointer;padding:20px;margin:0 auto;touch-action:manipulation}
.fc .front{font-family:var(--f-zh);font-size:clamp(56px,12vw,96px);line-height:1.1}
.fc .back{display:flex;flex-direction:column;gap:8px;align-items:center}
.fc .back .pyl{font-size:2rem;font-weight:800}
.fc .back .m{font-size:1.2rem}

/* home */
.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding:26px}
.hero .glyph{font-family:var(--f-cal);font-size:clamp(70px,11vw,124px);line-height:.95;color:var(--ink);letter-spacing:.02em}
@media (max-width:620px){.hero{grid-template-columns:1fr}.hero .glyph{display:none}}
.stats{display:flex;gap:26px;flex-wrap:wrap}
.stat b{display:block;font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--muted)}
.curr{display:flex;flex-direction:column;gap:8px}
.ch{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:14px 16px}
.ch .n{font-weight:800;font-size:1.1rem;font-variant-numeric:tabular-nums;color:var(--muted);text-align:center}
.ch .n.cur{color:var(--jade)}
.ch h3 .zh{font-weight:500;color:var(--muted);font-size:.95rem;margin-left:6px}
.ch p{font-size:.9rem;color:var(--muted)}
.ch .cal-l{font-size:.82rem;color:var(--muted);margin-top:4px}
.ch.locked{opacity:.72}
.ch.active{border-color:var(--jade)}
.unlock{border:2px solid var(--seal);background:color-mix(in srgb,var(--seal) 7%,var(--card))}
.prompt-box{font-family:ui-monospace,Menlo,monospace;font-size:.9rem;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px}

/* exam */
.parts{width:100%;border-collapse:collapse;font-size:.95rem}
.parts td{padding:8px 4px;border-bottom:1px solid var(--line)}
.parts td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.bigseal{width:120px;height:120px;border-radius:10px;background:var(--seal);color:#fff;display:grid;place-items:center;font-family:var(--f-cal);font-size:46px;line-height:1;transform:rotate(-7deg);box-shadow:inset 0 0 0 5px rgba(255,255,255,.28);flex:none}
.score{font-size:3rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.review li{margin-bottom:6px}
.scrim{display:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="scrim" id="scrim"></div>
<div class="app">
  <aside class="side" id="side" aria-label="Lessons"></aside>
  <div>
    <header class="topbar">
      <button class="btn sm" id="menuBtn" aria-label="Open lesson list">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <a class="brand" href="#home"><span class="mark">汉</span><span><b>Hanzi Workshop</b></span></a>
    </header>
    <main id="main"></main>
  </div>

  });

        const o = document.createElement("canvas"); o.width = o.height = 512; const c = o.getContext("2d");

}

function runQuiz(root, qs, opt = {}) {
  let i = 0, score = 0; const max = qs.reduce((s, q) => s + (q.pts || 1), 0); const log = [];
  function show() {
    if (i >= qs.length) return opt.onDone && opt.onDone({ score, max, log });
    const q = qs[i];
    root.innerHTML = `<div class="qz">
      <div class="qz-top"><span>${esc(q.part || "")}</span><span>${i + 1} / ${qs.length}</span></div>
      <div class="bar"><i style="width:${(i / qs.length) * 100}%"></i></div>
      <div class="qz-q">${q.q}</div><div class="qz-body"></div>
      <div class="qz-fb" aria-live="polite"></div>
      <div class="qz-nav">${q.type === "write" ? '<button class="btn" id="qzSkip">I don’t know, skip</button>' : ""}<button class="btn primary" id="qzNext" disabled>${i === qs.length - 1 ? "Finish" : "Next"}</button></div></div>`;
    const body = $(".qz-body", root), fb = $(".qz-fb", root), next = $("#qzNext", root);
    let answered = false;
    const answer = (ok, earned, correctHTML, extra) => {
      if (answered) return; answered = true; score += earned; log.push({ q, ok, earned, correctHTML });
      next.disabled = false; const sk = $("#qzSkip", root); if (sk) sk.disabled = true;
      if (!opt.exam) fb.innerHTML = (ok ? '<b class="ok">Correct.</b> ' : `<b class="bad">Not quite.</b> Answer: ${correctHTML}. `) + (q.explain || "") + (extra || "");
      else if (extra) fb.innerHTML = extra;
    };
    next.onclick = () => { i++; show(); };
    if (q.type === "mc" || q.type === "listen") {
      let head = "";
      if (q.type === "listen") head = `<div class="row" style="margin-bottom:10px"><button class="btn" data-say="${esc(q.say)}">${ICON.say.replace("<svg", '<svg class="icon"')} Play again</button></div>`;
      body.innerHTML = head + `<div class="opts">${q.opts.map((o, k) => `<button class="opt" data-k="${k}">${o}</button>`).join("")}</div>`;
      if (q.type === "listen") setTimeout(() => speak(q.say, 0.7), 150);
      $$(".opt", body).forEach(b => b.onclick = () => {
        const k = +b.dataset.k, ok = k === q.a;
        $$(".opt", body).forEach(x => x.disabled = true);
        if (opt.exam) b.classList.add("picked");
        else { b.classList.add(ok ? "right" : "wrong"); $$(".opt", body)[q.a].classList.add("right"); }
        answer(ok, ok ? (q.pts || 1) : 0, q.opts[q.a]);
      });
    } else if (q.type === "order") {
      const pool = shuffle(q.tokens.map((t, k) => ({ t, k })));
      body.innerHTML = `<div class="order-ans" aria-label="Your answer"></div><div class="order-pool" style="margin-top:10px">${pool.map((o, j) => `<button class="tok" data-j="${j}">${esc(o.t)}</button>`).join("")}</div><div class="row" style="margin-top:12px"><button class="btn" id="ordCheck" disabled>Check</button></div>`;
      const ans = $(".order-ans", body), chk = $("#ordCheck", body); const chosen = [];
      const sync = () => { ans.innerHTML = chosen.map((j, n) => `<button class="tok" data-n="${n}">${esc(pool[j].t)}</button>`).join(""); $$(".order-pool .tok", body).forEach(b => b.classList.toggle("used", chosen.includes(+b.dataset.j))); chk.disabled = chosen.length !== pool.length || answered; };
      body.addEventListener("click", e => {
        if (answered) return;
        const pb = e.target.closest(".order-pool .tok"); if (pb && !chosen.includes(+pb.dataset.j)) { chosen.push(+pb.dataset.j); sync(); return; }
        const ab = e.target.closest(".order-ans .tok"); if (ab) { chosen.splice(+ab.dataset.n, 1); sync(); }
      });
      chk.onclick = () => { const got = chosen.map(j => pool[j].t).join(""); const ok = got === q.tokens.join(""); chk.disabled = true; answer(ok, ok ? (q.pts || 1) : 0, `<span class="zh">${esc(q.tokens.join(""))}</span>`); };
    } else if (q.type === "write") {
      const size = fitSize(body, 320);
      body.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;gap:8px">${tzHTML(size)}<div class="small muted">Use a pen or your finger and write the strokes in the correct order. A hint appears after 3 mistakes.</div></div>`;
      const w = makeWriter($(".hw", body), q.ch, size, { showOutline: false });
      w.quiz({
        showHintAfterMisses: 3, leniency: 1.1,
        onComplete: sum => {
          const m = sum.totalMistakes; const pts = q.pts || 6; const earned = m <= 1 ? pts : m <= 3 ? Math.round(pts * 2 / 3) : m <= 6 ? Math.round(pts / 3) : 0;
          answer(earned === pts, earned, `<span class="zh">${q.ch}</span>`, `<span class="${earned ? "ok" : "bad"}">${m} mistake${m === 1 ? "" : "s"} · ${earned}/${pts} points</span>`);
          w.showCharacter();
        }
      });
      $("#qzSkip", root).onclick = () => { w.cancelQuiz(); w.showCharacter(); answer(false, 0, `<span class="zh">${q.ch}</span>`, '<span class="bad">Skipped · 0 points</span>'); };
    }
  }
  show();
}
function quizResult(root, r, lid, again) {

/* Character studio (lessons 6, 7) */
function studioHTML() { return `<div class="ctabs" id="ctabs"></div><div class="card studio" id="studio" style="margin-top:12px"></div>`; }
function mountStudio(chars, lid) {
  let cur = chars[0], mode = "watch", pad = null;
  const tabs = () => { $("#ctabs").innerHTML = chars.map(c => { const st = S.chars[c] || {}; return `<button class="ctab ${c === cur ? "on" : ""}" data-c="${c}" aria-label="${c} ${WRITE[c].m}">${c}<span class="dots"><i class="${st.g ? "g" : ""}"></i><i class="${st.m ? "m" : ""}"></i></span></button>`; }).join(""); };
  const check = () => { if (lid === "l6" && chars.every(c => S.chars[c] && S.chars[c].g)) markDone("l6"); if (lid === "l7" && chars.every(c => S.chars[c] && S.chars[c].g) && S.quiz.l7 != null) markDone("l7"); };
  const chips = () => { const st = S.chars[cur] || {}; const el = $$("#studio .info .chip"); if (el[0]) { el[0].className = "chip " + (st.g ? "jade" : ""); el[0].textContent = "Traced " + (st.g ? "✓" : "–"); } if (el[1]) { el[1].className = "chip " + (st.m ? "seal" : ""); el[1].textContent = "From memory " + (st.m ? "✓" : "–"); } };
  const render = () => {
    const c = cur, info = WRITE[c], n = CHARDATA[c].strokes.length;
    $("#studio").innerHTML = `<div class="left"><div id="wpad"></div>
      <div class="modes"><button class="btn sm" data-m="watch">${ICON.play} Watch</button><button class="btn sm" data-m="guided">Trace</button><button class="btn sm" data-m="memory">From memory</button><button class="btn sm" data-m="brush">${ICON.pen} Brush</button></div></div>
      <div class="stack info">
        <div class="row" style="gap:14px"><span class="hz">${c}</span><div class="stack" style="gap:2px"><span class="pyl">${pyHTML(info.p)}</span><b>${esc(info.m)}</b></div>${sayBtn(c, "Listen to " + pyPlain(info.p))}</div>
        <dl class="kv"><dt>Strokes</dt><dd>${n}</dd><dt>Memory aid</dt><dd>${esc(info.mn)}</dd><dt>Word</dt><dd><span class="ex">${info.ex[0]}</span> ${pyHTML(info.ex[1])} · ${esc(info.ex[2])} ${sayBtn(info.ex[0].replace("…", ""))}</dd><dt>Calligraphy</dt><dd>${esc(info.tip)}</dd></dl>
        <div class="row small"><span class="chip"></span><span class="chip"></span></div>
        <div class="fb" id="wfb" aria-live="polite"></div>
        <div id="cbox" hidden class="stack" style="gap:8px"><button class="btn sm" id="askClaude" hidden>Get feedback from Claude</button><div class="claudefb muted" id="claudeOut"></div></div>
      </div>`;
    chips(); setMode(mode);
  };
  const setMode = m => {
    mode = m; const c = cur; const padEl = $("#wpad"); const size = fitStudio($("#studio"), 380, 230);
    $$("[data-m]", $("#studio")).forEach(b => b.classList.toggle("on", b.dataset.m === m));
    const fb = $("#wfb"); fb.className = "fb"; fb.textContent = ""; $("#cbox").hidden = m !== "brush";
    if (m === "brush") {
      pad = brushPad(padEl, { size, ghost: c, onStroke: k => { if (k >= CHARDATA[c].strokes.length) { fb.className = "fb"; fb.textContent = "Now hide the template and try it from memory."; } } });
      wireClaude($("#askClaude"), $("#claudeOut"), pad, () => cur); return;
    }
    padEl.innerHTML = tzHTML(size); const w = makeWriter($(".hw", padEl), c, size, { showOutline: m !== "memory" });
    if (m === "watch") { w.animateCharacter({ onComplete: () => { fb.textContent = "Now use “Trace” to write over the template."; } }); return; }
    w.quiz({
      showHintAfterMisses: m === "guided" ? 2 : 3, leniency: 1,
      onMistake: d => { if (d.mistakesOnStroke === 1) { fb.className = "fb bad"; fb.textContent = `Stroke ${d.strokeNum + 1}: wrong direction or order.`; } },
      onCorrectStroke: d => { fb.className = "fb"; fb.textContent = d.strokesRemaining ? `${d.strokeNum + 1}/${d.strokeNum + 1 + d.strokesRemaining}` : ""; },
      onComplete: sum => {
        const e = sum.totalMistakes; S.chars[c] = S.chars[c] || {};
        const ms = `${e} mistake${e === 1 ? "" : "s"}`;
        if (m === "guided") { S.chars[c].g = true; fb.className = "fb ok"; fb.textContent = e ? `Done: ${ms}. When you’re ready, try “From memory”.` : "Perfect! Now try “From memory”."; }
        else if (e <= 2) { S.chars[c].m = true; S.chars[c].g = true; fb.className = "fb ok"; fb.textContent = `Written from memory (${ms}).`; }
        else { fb.className = "fb bad"; fb.textContent = `${ms}. Memory needs 2 mistakes or fewer; watch it again and retry.`; }
        save(); tabs(); check(); w.showCharacter(); chips();
      }
    });
  };
  $("#ctabs").addEventListener("click", e => { const b = e.target.closest("[data-c]"); if (!b) return; cur = b.dataset.c; mode = "watch"; tabs(); render(); });
  $("#studio").addEventListener("click", e => { const b = e.target.closest("[data-m]"); if (b) setMode(b.dataset.m); });
  tabs(); render();
}

      <div class="card stack" style="gap:6px"><h3><span class="zh">是</span> ${pyHTML("shì")} · to be</h3><p class="small">Subject + 是 + noun: <span class="ex">我是 ${esc(NAME())}</span> “I am ${esc(NAME())}”. Not used with adjectives.</p></div>
      <div class="card stack" style="gap:6px"><h3><span class="zh">吗</span> ${pyHTML("ma")} · question</h3><p class="small">Add 吗 to the end of a statement to make a yes/no question: <span class="ex">你是中国人吗？</span> “Are you Chinese?”</p></div>
      <div class="card stack" style="gap:6px"><h3><span class="zh">很</span> ${pyHTML("hěn")} · very</h3><p class="small">Adjectives don’t take 是; 很 usually goes in between: <span class="ex">我很好</span> “I’m well”. Here 很 is often just a link word.</p></div>
      <div class="card stack" style="gap:6px"><h3><span class="zh">不</span> ${pyHTML("bù")} · not</h3><p class="small">Goes before the verb: <span class="ex">我不是中国人</span> “I’m not Chinese”. Before a fourth tone it becomes second tone: <b>${pyHTML("bú shì")}</b>.</p></div>
    </div></section>
  <section class="sec"><div class="sec-h"><h2>Write</h2><span class="zh">写一写</span></div>${studioHTML()}</section>
  <section class="sec"><div class="sec-h"><h2>Quick check</h2><span class="zh">练习</span></div><div class="card" id="quiz"></div></section>
  ${lfoot("l7")}`;

    mc(`What does <span class="zh">我是中国人。</span> mean?`, "I’m Chinese.", ["You’re Chinese.", "China is big.", "I’m well."]),
    mc(`How is <span class="zh">不是</span> pronounced?`, pyHTML("bú shì"), [pyHTML("bù shì"), pyHTML("bǔ shì"), pyHTML("bū shì")], { explain: "不 becomes second tone before a fourth tone." }),
    mc("What’s the most natural way to say “I’m well”?", '<span class="zh">我很好。</span>', ['<span class="zh">我是好。</span>', '<span class="zh">好我。</span>', '<span class="zh">我好是。</span>'], { explain: "Adjectives don’t take 是; use 很." }),

/* Studio */
const ATELIER = ALLW.concat(["是", "不", "很", "再", "见", "谢", "吗", "国", "小", "月"]);
const EXTRA = { "再": ["zài", "again"], "见": ["jiàn", "to see"], "谢": ["xiè", "to thank"], "国": ["guó", "country"], "小": ["xiǎo", "small"], "月": ["yuè", "moon, month"] };
V.studio = () => `
  ${lhead("书法", "Free practice", "Calligraphy studio", "Pick a character and write it over the grey template or in an empty box. With a pen, pressure sets the brush width; with a finger, speed does.")}
  <div class="ctabs" id="actabs" style="margin-top:16px">${ATELIER.map((c, k) => `<button class="ctab ${k === 0 ? "on" : ""}" data-c="${c}">${c}</button>`).join("")}</div>
  <div class="card studio" style="margin-top:12px"><div class="left"><div id="apad"></div></div>

V.studio.mount = () => {
  let cur = ATELIER[0]; const size = fitStudio($(".studio"), 520, 240);
  const pad = brushPad($("#apad"), { size, ghost: cur });
  const info = () => {
    const w = WRITE[cur]; const vv = VOCAB.find(x => x.h === cur); const ex = EXTRA[cur];
    const p = w ? w.p : vv ? vv.p : ex ? ex[0] : "";
    const m = w ? w.m : vv ? vv.m : ex ? ex[1] : "";
    $("#ainfo").innerHTML = `<div class="row" style="gap:14px"><span class="hz">${cur}</span><div class="stack" style="gap:2px"><span class="pyl">${pyHTML(p)}</span><b>${esc(m)}</b></div>${sayBtn(cur)}</div>
      <p class="small muted">${CHARDATA[cur].strokes.length} strokes.${w ? " " + esc(w.tip) : ""}</p>
      <div class="row"><button class="btn sm" id="aWatch">${ICON.play} Show stroke order</button></div><div id="aWatchBox"></div>
      <div class="stack" style="gap:8px"><button class="btn sm" id="askClaude" hidden>Get feedback from Claude</button><div class="claudefb muted" id="claudeOut"></div></div>`;
    $("#aWatch").onclick = () => { $("#aWatchBox").innerHTML = tzHTML(140); const ww = makeWriter($("#aWatchBox .hw"), cur, 140, { padding: 10 }); ww.animateCharacter(); };

/* Exam */
const PASS = 80;
function buildExam() {
  const qs = [];
  // A: tones (5 × 2)
  shuffle(["hǎo", "nǐ", "wǒ", "shì", "bù", "rén", "dà", "kǒu", "zhōng", "sān", "èr", "yī", "shí", "nǚ", "zǐ", "hěn", "xiè", "zài", "jiàn", "guó"]).slice(0, 4)
    .forEach(s => qs.push({ type: "mc", part: "A · Tones", pts: 2, q: `<span class="bigpy">${esc(s)}</span>Which tone is this syllable?`, opts: [1, 2, 3, 4].map(k => `Tone ${k}`), a: toneOf(s) - 1 }));
  qs.push(pick([
    mc(`How is <span class="zh">你好</span> said in speech?`, "ní hǎo", ["nǐ hǎo", "nì hào", "nī hāo"], { part: "A · Tones", pts: 2 }),
    mc(`How is <span class="zh">不是</span> pronounced?`, "bú shì", ["bù shì", "bǔ shì", "bū shì"], { part: "A · Tones", pts: 2 }),
    mc(`How is <span class="zh">很好</span> said in speech?`, "hén hǎo", ["hěn hǎo", "hèn hào", "hēn hāo"], { part: "A · Tones", pts: 2 })
  ], 1)[0]);
  // B: meaning (8 × 3)
  pick(VOCAB, 8).forEach(v => { const wr = pick(VOCAB.filter(x => x.m !== v.m), 3).map(x => esc(x.m)); qs.push(mc(`<span class="zh">${v.h}</span>What does it mean?`, esc(v.m), wr, { part: "B · Meaning", pts: 3 })); });
  // C: pinyin (6 × 3)
  pick(VOCAB.filter(v => v.p !== "ma"), 6).forEach(v => {
    const wr = pyVariants(v.p, 3).map(pyPlain);
    qs.push(mc(`<span class="zh">${v.h}</span>Which pronunciation is correct?`, pyPlain(v.p), wr, { part: "C · Pronunciation", pts: 3 }));
  });
  // D: strokes (4 × 3)
  pick(ALLW.filter(c => CHARDATA[c].strokes.length > 1), 2).forEach(c => { const n = CHARDATA[c].strokes.length; const wr = shuffle([n - 2, n - 1, n + 1, n + 2].filter(x => x > 0)).slice(0, 3).map(String); qs.push(mc(`<span class="zh">${c}</span>How many strokes does it have?`, String(n), wr, { part: "D · Strokes and order", pts: 3 })); });
  const s1 = pick(STROKES, 1)[0];
  qs.push(...pick([
    mc(`What is the Chinese name of the “${s1.t}” stroke?`, `<span class="zh">${s1.zh}</span> ${s1.p}`, pick(STROKES.filter(x => x !== s1), 3).map(x => `<span class="zh">${x.zh}</span> ${x.p}`), { part: "D · Strokes and order", pts: 3 }),
    ...RULEQ().map(q => Object.assign(q, { part: "D · Strokes and order", pts: 3 }))
  ], 2));
  // E: sentences (4 × 3)
  const orders = [
    { q: "Build the sentence “I’m Chinese.”", tokens: ["我", "是", "中国人"] },
    { q: "Build the sentence “How are you?”", tokens: ["你", "好", "吗"] },
    { q: "Build the sentence “I’m very well.”", tokens: ["我", "很", "好"] },
    { q: "Build the sentence “I’m not Chinese.”", tokens: ["我", "不", "是", "中国人"] },
    { q: "Build the sentence “Are you Chinese?”", tokens: ["你", "是", "中国人", "吗"] }
  ];
  pick(orders, 2).forEach(o => qs.push({ type: "order", part: "E · Sentences", pts: 3, q: o.q, tokens: o.tokens }));
  qs.push(...pick([
    mc("Which one means “thank you”?", '<span class="zh">谢谢</span>', ['<span class="zh">再见</span>', '<span class="zh">你好</span>', '<span class="zh">很好</span>'], { part: "E · Sentences", pts: 3 }),
    mc(`Which is a good answer to <span class="zh">你好吗？</span>`, '<span class="zh">我很好，谢谢。</span>', ['<span class="zh">再见！</span>', '<span class="zh">我是中国。</span>', '<span class="zh">你是我。</span>'], { part: "E · Sentences", pts: 3 }),
    mc(`What does <span class="zh">我不是中国人。</span> mean?`, "I’m not Chinese.", ["I’m Chinese.", "You’re not Chinese.", "Are you Chinese?"], { part: "E · Sentences", pts: 3 }),
    mc("Which one is grammatically correct?", '<span class="zh">我很好。</span>', ['<span class="zh">我是好。</span>', '<span class="zh">我好很。</span>', '<span class="zh">很我好。</span>'], { part: "E · Sentences", pts: 3 })
  ], 2));
  // F: writing (4 × 6)
  pick(ALLW, 4).forEach(c => qs.push({ type: "write", part: "F · Writing from memory", pts: 6, ch: c, q: `Write from memory: <span class="bigpy">${pyPlain(WRITE[c].p)}</span>“${esc(WRITE[c].m)}”` }));
  return qs;
}
V.exam = () => `
  ${lhead("考试", "Chapter 1 · 25–30 min", "Chapter 1 exam", `Score at least ${PASS} out of 100 to unlock chapter 2. The questions change on every attempt, and correct answers aren’t shown during the exam.`)}
  <div id="exam" style="margin-top:18px"></div>`;
V.exam.mount = () => {
  const root = $("#exam");
  const intro = () => {
    const missing = LESSONS.filter(l => !lessonDone(l.id));
    root.innerHTML = `${S.exam.passed ? unlockCard() : ""}
    <div class="grid2" style="margin-top:${S.exam.passed ? 18 : 0}px">
      <div class="card stack"><h2>Sections</h2><table class="parts"><tbody>
        <tr><td>A · Tones</td><td>10</td></tr><tr><td>B · Meaning</td><td>24</td></tr><tr><td>C · Pronunciation</td><td>18</td></tr>
        <tr><td>D · Strokes and order</td><td>12</td></tr><tr><td>E · Sentences</td><td>12</td></tr><tr><td>F · Writing from memory (4 characters)</td><td>24</td></tr>
        <tr><td><b>Total</b></td><td>100</td></tr></tbody></table>
        <p class="small muted">Writing is scored by mistakes: 0–1 mistakes 6 points, 2–3 mistakes 4, 4–6 mistakes 2. Pinyin isn’t tone-colored in the exam.</p></div>
      <div class="card stack"><h2>Status</h2>
        <div class="stats"><div class="stat"><b>${S.exam.best || "–"}</b><span>best score</span></div><div class="stat"><b>${S.exam.attempts || 0}</b><span>attempts</span></div><div class="stat"><b>${PASS}</b><span>pass mark</span></div></div>
        ${missing.length ? `<div class="note warn">${missing.length} lesson${missing.length === 1 ? " isn’t" : "s aren’t"} complete yet: ${missing.map(l => esc(l.t)).join(", ")}. You can still take the exam.</div>` : '<div class="note">All lessons complete. You’re ready.</div>'}
        <button class="btn primary" id="startExam">${S.exam.attempts ? "Try again" : "Start the exam"}</button></div>
    </div>`;
    wireUnlock(); $("#startExam").onclick = start;
  };
  const start = () => {
    root.innerHTML = '<div class="card" id="examq"></div>';
    runQuiz($("#examq"), buildExam(), { exam: true, onDone: done });
    root.scrollIntoView({ behavior: "smooth", block: "start" });
  };
  const done = r => {
    const pct = Math.round((r.score / r.max) * 100); const pass = pct >= PASS;
    S.exam.attempts = (S.exam.attempts || 0) + 1; S.exam.last = pct; S.exam.best = Math.max(S.exam.best || 0, pct);
    if (pass && !S.exam.passed) { S.exam.passed = true; S.exam.passedAt = new Date().toISOString().slice(0, 10); }
    save(); renderSide();
    const parts = {}; r.log.forEach(x => { const p = x.q.part; parts[p] = parts[p] || [0, 0]; parts[p][0] += x.earned; parts[p][1] += x.q.pts || 1; });
    const wrong = r.log.filter(x => !x.ok);
    root.innerHTML = `<div class="card stack">
      <div class="row" style="gap:22px">${pass ? '<span class="bigseal">合格</span>' : ""}<div class="stack" style="gap:6px"><span class="score">${pct}<span style="font-size:1.2rem;color:var(--muted)"> / 100</span></span><h2>${pass ? "You passed! Chapter 2 is unlocked." : `The pass mark is ${PASS}. Not this time.`}</h2><p class="muted">${pass ? "Well written." : "Look over your mistakes below, review the related lessons and try again."}</p></div></div>
      <table class="parts"><tbody>${Object.entries(parts).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v[0]} / ${v[1]}</td></tr>`).join("")}</tbody></table>
      ${wrong.length ? `<div><h3>Review</h3><ul class="review small">${wrong.map(x => `<li>${x.q.q.replace(/<span class="(bigpy|zh)">/g, '<span class="zh" style="font-weight:700">')} → <b>${x.correctHTML}</b></li>`).join("")}</ul></div>` : ""}
      <div class="row"><button class="btn" id="retry">Try again</button>${pass ? '<a class="btn primary" href="#syllabus">Back to the syllabus</a>' : '<a class="btn primary" href="#l8">Go to the review cards</a>'}</div></div>
      ${pass ? unlockCard() : ""}`;
    $("#retry").onclick = start; wireUnlock();
  };
  intro();
};

/* ---------- routing ---------- */
const VALID = ["home", "syllabus", "l1", "l2", "l3", "l4", "l5", "l6", "l7", "l8", "exam", "studio"];
const ALIAS = { ana: "home", mufredat: "syllabus", sinav: "exam", atolye: "studio" };
let lastView = null;
function route() {
  let h = (location.hash || "#home").slice(1); if (ALIAS[h]) { location.replace("#" + ALIAS[h]); return; } if (!VALID.includes(h)) h = "home";
  if (hasTTS) try { speechSynthesis.cancel(); } catch (e) {}
  const main = $("#main"); main.innerHTML = V[h]();
  if (V[h].mount) V[h].mount();
  if (lastView !== h) window.scrollTo(0, 0); lastView = h;
  document.body.classList.remove("drawer"); renderSide();
}
document.addEventListener("click", e => {
  const s = e.target.closest("[data-say]"); if (s) { e.preventDefault(); speak(s.dataset.say, s.dataset.say.length > 3 ? 0.85 : 0.75); }
});
$("#menuBtn").onclick = () => document.body.classList.add("drawer");
$("#scrim").onclick = () => document.body.classList.remove("drawer");
window.addEventListener("hashchange", route);
renderSide(); route();
